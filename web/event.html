<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>You're invited · Lamma</title>
  <meta property="og:title" content="You're invited on Lamma" />
  <meta property="og:description" content="Open this invite in the Lamma app." />
  <meta property="og:image" content="https://lamma-links.vercel.app/assets/icon-192.png" />
  <link rel="icon" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/logo.png" alt="Lamma" width="160" height="78" />
    <h1 id="title">You're invited 🎉</h1>
    <p id="subtitle" class="muted">Open this event in the Lamma app to see the details.</p>

    <div class="actions">
      <a id="open-app" class="btn btn-primary" href="/">Open in Lamma</a>
      <a id="android-store" class="btn btn-secondary" hidden>Download for Android</a>
      <a id="ios-store" class="btn btn-secondary" hidden>Download for iOS</a>
    </div>

    <p id="invalid" class="error" hidden>This invite link looks broken. Ask your friend to send it again.</p>
    <p class="meta"><span id="id-label">Event ID</span>: <code id="id-value">…</code></p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
