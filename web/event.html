<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title data-i18n="event.docTitle">You're invited · Lamma</title>
  <meta name="description" content="Open this invite in the Lamma app." data-i18n-content="event.metaDesc" />
  <meta property="og:title" content="You're invited on Lamma" />
  <meta property="og:description" content="Open this invite in the Lamma app." />
  <meta property="og:image" content="https://lamma-links.vercel.app/assets/icon-192.png" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff7f4" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15131b" />
  <script>
    /* Theme + language before first paint (no flash). Overrides: ?theme=dark|light, ?lang=ar|en. See README. */
    (function (d, w) {
      var r = d.documentElement, s = null, q = { get: function () { return null; } };
      try { q = new URLSearchParams(w.location.search); } catch (e) {}
      try { s = w.localStorage; } catch (e) {}
      function saved(k) { try { return s ? s.getItem(k) : null; } catch (e) { return null; } }
      var t = q.get('theme');
      if (t !== 'dark' && t !== 'light') t = saved('lamma-theme');
      if (t === 'dark' || t === 'light') r.setAttribute('data-theme', t);
      var l = q.get('lang');
      if (l === 'ar' || l === 'en') { try { s.setItem('lamma-lang', l); } catch (e) {} }
      else l = saved('lamma-lang');
      if (l !== 'ar' && l !== 'en') l = /^ar/i.test(w.navigator.language || '') ? 'ar' : 'en';
      r.setAttribute('lang', l);
      r.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
      if (l !== 'en') {
        r.classList.add('i18n-pending');
        w.setTimeout(function () { r.classList.remove('i18n-pending'); }, 2000);
      }
    })(document, window);
  </script>
  <link rel="icon" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&amp;display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="page-body">
  <header class="site-header">
    <a class="brand" href="/" aria-label="Lamma home" data-i18n-aria-label="a11y.home">
      <img src="/assets/favicon.png" alt="" width="28" height="28" />
      <span data-i18n="brand">Lamma</span>
    </a>
    <div class="header-tools">
      <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria-label="a11y.language">
        <button type="button" data-set-lang="en" lang="en" dir="ltr">EN</button>
        <button type="button" data-set-lang="ar" lang="ar" dir="rtl">عربي</button>
      </div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch light or dark theme" data-i18n-aria-label="a11y.theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main class="card">
    <img class="logo" src="/assets/logo.png" alt="Lamma" data-i18n-alt="brand" width="160" height="78" />
    <h1 id="title" data-i18n="event.title">You're invited 🎉</h1>
    <p id="subtitle" class="muted" data-i18n="event.subtitle">Open this event in the Lamma app to see the details.</p>

    <div class="actions">
      <a id="open-app" class="btn btn-primary" href="/" data-i18n="event.open">Open in Lamma</a>
      <a id="android-store" class="btn btn-secondary" data-i18n="store.android" hidden>Download for Android</a>
      <a id="ios-store" class="btn btn-secondary" data-i18n="store.ios" hidden>Download for iOS</a>
    </div>

    <p id="invalid" class="error" data-i18n="event.invalid" hidden>This invite link looks broken. Ask your friend to send it again.</p>
    <p class="meta"><span id="id-label" data-i18n="event.idLabel">Event ID</span>: <code id="id-value" dir="ltr">…</code></p>
  </main>
  <footer class="site-footer">
    <nav aria-label="Lamma">
      <a href="/" data-i18n="nav.home">Home</a>
      <a href="/about" data-i18n="nav.about">About</a>
      <a href="/contact" data-i18n="nav.contact">Contact</a>
      <a href="/terms" data-i18n="nav.terms">Terms</a>
      <a href="/privacy" data-i18n="nav.privacy">Privacy</a>
    </nav>
    <p data-i18n="footer.copy">&copy; 2026 Lamma</p>
  </footer>
  <script src="/i18n.js" defer></script>
  <script src="/theme.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
